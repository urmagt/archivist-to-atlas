name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx esbuild main.js --bundle --platform=node --external:obsidian --format=cjs --outfile=dist/main.js
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/main.js manifest.json --title "${GITHUB_REF_NAME}" --notes "Archivist to Atlas ${GITHUB_REF_NAME}"
